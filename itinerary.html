<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Itinerary - Traviso</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- Leaflet Interactive Map CSS (Optional & Non-Blocking) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
</head>
<body class="itinerary-page-body">

    <div class="video-background">
        <video autoplay muted loop id="bg-video" playsinline>
            <source src="assets/background-video-compressed.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    </div>

    <header class="main-header">
        <a href="index.html" class="logo">Traviso</a>
        <nav>
            <a href="index.html">Plan Trip</a>
            <a href="my-trips.html">My Trips</a>
            <a href="login.html" class="btn-login">Login</a>
        </nav>
    </header>

    <main class="main-content">
        <div id="toast-message" class="toast-notification" role="alert" style="display: none;"></div>
        <div id="itinerary-content" class="itinerary-content-container">
            <!-- Dynamically populated safely via itinerary.js -->
        </div>
    </main>

    <!-- Leaflet Interactive Map JS (Optional & Non-Blocking) -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="storage.js"></script>
    <script src="itinerary.js"></script>
</body>
</html>
